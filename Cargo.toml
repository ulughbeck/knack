[package]
name = "knack"
version = "0.0.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "0.6"
tempfile = "3"
dirs = "5"
thiserror = "1"
atty = "0.2"
url = "2"
crossterm = "0.27"
